[workspace]
resolver = "3"
members = ["crates/cpu8086", "crates/pc", "crates/sfforth", "crates/starflight"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Travis Geiselbrecht <geist@foobox.com>"]

[profile.dev]
# The emulator is unusably slow without optimisation; keep debug info.
opt-level = 2

[profile.release]
debug = 1
