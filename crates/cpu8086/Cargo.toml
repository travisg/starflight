[package]
name = "cpu8086"
description = "Real-mode 8086/8088 interpreter core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Serialize/Deserialize for `Cpu`, for machine snapshots.
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
