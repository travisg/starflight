[package]
name = "pc"
description = "The IBM PC/XT-class machine Starflight runs on: devices, BIOS and DOS HLE"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
bincode = "1.3"
cpu8086 = { path = "../cpu8086", features = ["serde"] }
flate2 = "1"
font8x8 = "0.3"
serde = { version = "1", features = ["derive"] }
